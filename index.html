<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./style.css" />
    <title>Task 1 - Flex Container</title>
  </head>
  <body>
    <h1 id="header">Flex container task</h1>
    <div class="btn-container">
      <button class="secondary">
        <svg>
          <use xlink:href="./workflow.svg#workflow-fluid-flow"></use>
        </svg>
        Trip shopping cart
      </button>
      <button class="primary">
        <svg>
          <use xlink:href="./workflow.svg#workflow-air"></use>
        </svg>
        Book flight
      </button>
      <button class="primary">
        <svg>
          <use xlink:href="./workflow.svg#workflow-rail"></use>
        </svg>
        Book train
      </button>
      <button class="primary">
        <svg>
          <use xlink:href="./workflow.svg#workflow-hotel"></use>
        </svg>
        Book hotel
      </button>
      <button class="primary">
        <svg>
          <use xlink:href="./workflow.svg#workflow-car"></use>
        </svg>
        Book car/transfer
      </button>
      <button class="secondary" id="ctw-btn">
        <svg>
          <use xlink:href="./workflow.svg#workflow-wizzard"></use>
        </svg>
        cTW
      </button>
    </div>
  </body>
</html>
